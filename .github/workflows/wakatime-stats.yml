name: 💥 WakaTime Update Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wakatime-profile-stats
  cancel-in-progress: false

jobs:
  generate-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test SVG generator offline
        run: python -m unittest discover -s tests -p 'test_wakatime*.py' -v

      - name: Require WakaTime OAuth token
        env:
          WAKATIME_OAUTH_TOKEN: ${{ secrets.WAKATIME_OAUTH_TOKEN }}
        run: |
          if [ -z "$WAKATIME_OAUTH_TOKEN" ]; then
            echo "::error::WAKATIME_OAUTH_TOKEN não configurado. Veja docs/WAKATIME.md."
            exit 1
          fi

      - name: Generate SVG using WakaTime official API
        env:
          WAKATIME_OAUTH_TOKEN: ${{ secrets.WAKATIME_OAUTH_TOKEN }}
        run: python scripts/generate_wakatime_cards.py

      - name: Validate generated SVGs
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for name in ["all_projs_bar_vertical.svg", "spedometer.svg",
                       "weekly_ranking.svg", "heatmap.svg"]:
              file = Path("wakatime") / name
              content = file.read_text(encoding="utf-8")
              ET.fromstring(content)
              if any(error in content for error in
                     ["Card Error", "Heatmap Error", "WakaTime API error"]):
                  raise SystemExit(f"SVG inválido: {name}")
          print("Todos os SVGs válidos.")
          PY

      - name: Commit only verified cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- wakatime/all_projs_bar_vertical.svg wakatime/spedometer.svg wakatime/weekly_ranking.svg wakatime/heatmap.svg
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos gráficos."
            exit 0
          fi
          # Only refresh GitHub's rendered image cache after verified SVG changes.
          python - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import re

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          version = datetime.now(timezone.utc).strftime("%Y%m%d%H%M%S")
          pattern = r"(wakatime/(?:all_projs_bar_vertical|spedometer|weekly_ranking|heatmap)\.svg)(?:\?v=\d+)?"
          text, count = re.subn(pattern, lambda m: f"{m.group(1)}?v={version}", text)
          if count != 4:
              raise SystemExit(f"Esperava atualizar 4 referências SVG, encontradas: {count}")
          path.write_text(text, encoding="utf-8")
          PY
          git add -- README.md
          git commit -m "chore(wakatime): update validated activity cards"
          git push
